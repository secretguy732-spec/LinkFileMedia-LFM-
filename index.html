// === Kripto: PBKDF2 (hash akun & kunci file) + AES-256-GCM ===
const pbk=async(pw,salt,use)=>crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,[use]);

const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

function zip(fs){const P=[],C=[];let off=0,cs=0;for(const f of fs){const nm=enc.encode(f.name),c=crc(f.data),n=f.data.length,h=new DataView(new ArrayBuffer(30));
h.setUint32(0,0x04034b50,1);h.setUint16(4,20,1);h.setUint16(6,0x800,1);h.setUint16(12,0x21,1);h.setUint32(14,c,1);h.setUint32(18,n,1);h.setUint32(22,n,1);h.setUint16(26,nm.length,1);P.push(h.buffer,nm,f.data);
const d=new DataView(new ArrayBuffer(46));d.setUint32(0,0x02014b50,1);d.setUint16(4,20,1);d.setUint16(6,20,1);d.setUint16(8,0x800,1);d.setUint16(14,0x21,1);d.setUint32(16,c,1);d.setUint32(20,n,1);d.setUint32(24,n,1);d.setUint16(28,nm.length,1);d.setUint32(42,off,1);C.push(d.buffer,nm);off+=30+nm.length+n;cs+=46+nm.length}
const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,1);e.setUint16(8,fs.length,1);e.setUint16(10,fs.length,1);e.setUint32(12,cs,1);e.setUint32(16,off,1);return new Blob([...P,...C,e.buffer],{type:'application/zip'})}
const save=(b,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),9e3)};

async function doAuth(mode){const n=$('#u').value.trim().toLowerCase(),p=$('#p').value,U=LS.get('lfm_users',{}),F=LS.get('lfm_fail',{n:0,t:0});

const stage=()=>{if(l.ads&&!(u&&u.premium))ad(1);else ready()};
const card=a=>`<a class="ad" style="background:linear-gradient(135deg,${a.c.split(',')[0]},${a.c.split(',')[1]})" href="${esc(a.u)}" ${a.u[0]=='#'?'':'target="_blank" rel="noopener noreferrer sponsored"'}><small>SPONSORED</small><b>${esc(a.t)}</b>${esc(a.d)}<br><span class="cta">${esc(a.b)} →</span></a>`;
const ad=n=>{let s=AD_SECS;app.innerHTML=`<div class="card">${info}<br><br><div class="dots">${[1,2,3].slice(0,AD_STEPS).map(i=>`<span class="dot ${i<=n?'on':''}"></span>`).join('')}</div><h2>Langkah ${n} dari ${AD_STEPS}</h2>${card(AD_SLOTS[(n-1)%AD_SLOTS.length])}${card(AD_SLOTS[n%AD_SLOTS.length])}<div class="bar"><i id="pb"></i></div><p class="m" id="ct"></p><label class="chk"><input type="checkbox" id="rb" disabled> Saya bukan robot</label><br><button class="b" id="gb" disabled>${n<AD_STEPS?'Lanjut':'Ke file'}</button></div>`;
$('#rb').onchange=e=>$('#gb').disabled=!e.target.checked;$('#gb').onclick=()=>n<AD_STEPS?ad(n+1):ready();
const tick=()=>{if(!$('#pb'))return clearInterval(tm);if(document.hidden){$('#ct').textContent='Timer berhenti saat tab ditinggal';return}$('#pb').style.width=((AD_SECS-s)/AD_SECS*100)+'%';if(s<=0){clearInterval(tm);$('#ct').textContent='Centang verifikasi lalu lanjut';$('#rb').disabled=false;return}$('#ct').textContent='Tunggu '+s+' detik…';s--};tick();tm=setInterval(tick,1000)};
const bump=()=>{const A=LS.get('lfm_links',{});if(A[id]){A[id].dl++;LS.set('lfm_links',A)}};
const ready=()=>{app.innerHTML=`<div class="card">${info}${u&&u.premium&&l.ads?'<p><span class="tag">Premium</span> iklan di-bypass ⚡</p>':''}<br>${l.files.length>1?'<button class="b" id="da">⬇ Download semua (ZIP)</button>':''}<br><br>${l.files.map((f,i)=>`<div class="row"><div class="n">${esc(f.name)}<div class="m">${fmt(f.size)}</div></div><button class="b t s" data-i="${i}">⬇ Unduh</button></div>`).join('')}</div>`;
app.querySelectorAll('[data-i]').forEach(b=>b.onclick=async()=>{try{const i=+b.dataset.i;save(await blobOf(l,i,key),l.files[i].name);bump();toast('Mengunduh…')}catch(e){toast('Gagal membuka file (hanya ada di browser pemilik)')}});
if($('#da'))$('#da').onclick=async()=>{try{toast('Menyiapkan ZIP…');const seen={},fs=[];for(let i=0;i<l.files.length;i++){let n=l.files[i].name.replace(/[\\\/]/g,'_');if(seen[n])n=seen[n]+++'_'+n;else seen[n]=1;fs.push({name:n,data:new Uint8Array(await (await blobOf(l,i,key)).arrayBuffer())})}save(zip(fs),(l.title.replace(/[^\w\- ]/g,'')||'lfm')+'.zip');bump();toast('ZIP siap')}catch(e){toast('Gagal membuat ZIP')}}};
l.enc?pwStage():stage()}
function route(){clearInterval(tm);nav();const h=location.hash.slice(1)||'/',m=h.match(/^\/d\/([a-z0-9]+)/);if(m)return dl(m[1]);if(h=='/auth')return auth();if(h=='/dash')return me()?dash():(location.hash='#/auth');home()}
addEventListener('hashchange',route);route();
</script></body></html>
